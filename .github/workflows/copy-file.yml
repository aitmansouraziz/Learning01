name: Copy file to another repository

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Path of the file to copy from source repo"
        required: true
        default: "file.txt"

      target_repo:
        description: "Target repository (OWNER/REPO)"
        required: true

      target_branch:
        description: "Target branch"
        required: true
        default: "main"

      target_path:
        description: "Destination path in target repo"
        required: true
        default: "file.txt"

jobs:
  copy-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Clone target repository
        run: |
          git clone \
            --branch ${{ inputs.target_branch }} \
            https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/${{ inputs.target_repo }}.git \
            target-repo

      - name: Copy file
        run: |
          mkdir -p "$(dirname target-repo/${{ inputs.target_path }})"
          cp "${{ inputs.source_file }}" "target-repo/${{ inputs.target_path }}"

      - name: Commit and push changes
        run: |
          cd target-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${{ inputs.target_path }}"
          git commit -m "Copy ${{ inputs.source_file }} from source repository" || echo "No changes to commit"
          git push
